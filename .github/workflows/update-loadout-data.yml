# Refreshes the Loadout Creator's bundled item data entirely in CI.
#
# - Decodes item definitions from the OSRS game cache via the OpenRS2 archive
#   (two ~0.7 MB requests; scripts/lib/osrs-cache.mjs does the decoding).
# - Downloads only icons for new items: scripts/.icon-cache is persisted
#   between runs with actions/cache, so a normal run fetches a handful.
# - Commits the regenerated public/loadout files only when they changed
#   (the fetch script produces byte-identical output on the same game build),
#   then dispatches the Pages deploy (a GITHUB_TOKEN push does not trigger
#   the deploy workflow's `push` event on its own).
#
# Runs every Wednesday evening UTC (after OSRS's usual update window) and on
# demand from the Actions tab. The site build itself never runs this.

name: Update loadout data

on:
  schedule:
    - cron: '0 18 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-loadout-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore icon cache
        uses: actions/cache@v4
        with:
          path: scripts/.icon-cache
          key: loadout-icons-${{ github.run_id }}
          restore-keys: loadout-icons-

      - name: Rebuild loadout data from the game cache
        run: node scripts/fetch-loadout-data.mjs --openrs2

      - name: Sanity-check the output
        run: |
          node -e "
            const d = require('./public/loadout/items.json');
            const equipable = d.items.filter(i => i[2] >= 0).length;
            console.log(d.items.length + ' items, ' + equipable + ' equipable, updated ' + d.updated);
            if (d.items.length < 6000 || equipable < 4000) {
              throw new Error('item counts implausibly low - refusing to commit');
            }
          "

      - name: Commit and push if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain public/loadout)" ]; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/loadout
            git commit -m "Update loadout data from the current game cache"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
